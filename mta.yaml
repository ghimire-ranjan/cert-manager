_schema-version: 3.3.0
ID: cert-manager
version: 1.0.0
description: "Certification manager: track SAP certifications"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: cert-manager-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cert-manager-auth
      - name: cert-manager-db
      - name: cert-manager-destination

  - name: cert-manager-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: cert-manager-db

  - name: cert-manager-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: certmanagerapprovals
          artifacts:
            - approvals.zip
          target-path: app/
        - name: certmanagercatalogue
          artifacts:
            - catalogue.zip
          target-path: app/
        - name: certmanagercertifications
          artifacts:
            - certifications.zip
          target-path: app/
        - name: certmanageremployees
          artifacts:
            - employees.zip
          target-path: app/
    requires:
      - name: cert-manager-auth
      - name: srv-api
      - name: cert-manager-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: certmanagerapprovals
    type: html5
    path: app/approvals
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: certmanagercatalogue
    type: html5
    path: app/catalogue
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: certmanagercertifications
    type: html5
    path: app/certifications
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: certmanageremployees
    type: html5
    path: app/employees
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: cert-manager-destinations
    type: com.sap.application.content
    requires:
      - name: cert-manager-auth
        parameters:
          service-key:
            name: cert-manager-auth-key
      - name: cert-manager-html5-repo-host
        parameters:
          service-key:
            name: cert-manager-html5-repo-host-key
      - name: srv-api
      - name: cert-manager-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: cert-manager-html5-repository
              ServiceInstanceName: cert-manager-html5-repo-host
              ServiceKeyName: cert-manager-html5-repo-host-key
              sap.cloud.service: certmanager.service
            - Name: cert-manager-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cert-manager-auth
              ServiceKeyName: cert-manager-auth-key
              sap.cloud.service: certmanager.service

resources:
  - name: cert-manager-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cert-manager-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: cert-manager-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: cert-manager-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: cert-manager-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
